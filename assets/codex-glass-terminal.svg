<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
  <title id="title">CodeX glass coding terminal</title>
  <desc id="desc">A translucent 3D learning terminal with a small turtle face, keyboard, and floating coding tiles.</desc>
  <defs>
    <linearGradient id="body" x1="160" y1="84" x2="720" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fafdff" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#cfeeff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8fb9ef" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="edge" x1="144" y1="152" x2="752" y2="594" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#90e6d7"/>
      <stop offset="1" stop-color="#ffb15e"/>
    </linearGradient>
    <linearGradient id="screen" x1="262" y1="156" x2="610" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset=".52" stop-color="#bdf0ec"/>
      <stop offset="1" stop-color="#8faee9"/>
    </linearGradient>
    <linearGradient id="glass" x1="212" y1="130" x2="640" y2="536" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".86"/>
      <stop offset=".42" stop-color="#dff8ff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="32" dy="44" stdDeviation="24" flood-color="#2a5f95" flood-opacity=".22"/>
      <feDropShadow dx="-12" dy="10" stdDeviation="14" flood-color="#ffffff" flood-opacity=".55"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="455" cy="671" rx="264" ry="38" fill="#5e7ba6" opacity=".16" filter="url(#soft)"/>
  <g filter="url(#shadow)">

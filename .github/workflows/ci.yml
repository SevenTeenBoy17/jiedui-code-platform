# 结对编程智能体平台 · CI
#
# 这个仓库此前**没有任何自动门禁**：`npm run build` 只是 `vite build`，
# 类型检查与文案 lint 全靠人记得敲 `npm run check`，pytest 也没人跑。
# 一旦有人忘了，"验收通过"就是一句空话。
#
# 注意：后端必须用仓库自带的依赖版本装。系统里若存在旧的 fastapi/starlette
# （0.115 + 1.0 那一组），会报 `Router.__init__() got an unexpected keyword argument 'on_startup'`。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: pytest
        env:
          PYTHONUTF8: '1'
          AI_API_KEY: test-key            # 测试不打真实网络，占位即可
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # build 里已串 vue-tsc + lint-copy，三道一起卡
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 密钥不得进仓库
        run: |
          if grep -rn --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=.git \
                     --exclude-dir=__pycache__ -E 'sk-[A-Za-z0-9]{24,}' . ; then
            echo "::error::检测到疑似 API 密钥硬编码"
            exit 1
          fi
          echo "OK：未发现硬编码密钥"
